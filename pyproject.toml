[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jqg2code-jqrewrite"
version = "0.1.0"
description = "识别功能等价的查询写法，归组并标出可简化的表达式"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jqg2code" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jqg2code.github.io"
Repository = "https://github.com/jqg2code/jqrewrite"
Issues = "https://github.com/jqg2code/jqrewrite/issues"

[project.scripts]
jqrewrite = "jqrewrite:main"

[tool.setuptools]
py-modules = ["jqrewrite"]
